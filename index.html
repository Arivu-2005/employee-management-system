<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top bar: title + totals -->
  <header class="top">
    <div>
      <h1>Employee Management System</h1>
      <p class="sub">Every employee gets an ID card. Add, raise, or delete.</p>
    </div>
    <div class="stats">
      <div><span id="countBox">0</span><small>Employees</small></div>
      <div><span id="payrollBox">Rs. 0.00</span><small>Total payroll</small></div>
    </div>
  </header>

  <!-- Success / error message -->
  <p id="message" role="status"></p>

  <div class="layout">

    <!-- LEFT SIDE: forms -->
    <aside class="side">

      <form class="panel" id="addForm">
        <h2>Add employee</h2>
        <label for="empId">Employee ID</label>
        <input id="empId" required>
        <label for="empName">Name</label>
        <input id="empName" required>
        <label for="empDept">Department</label>
        <input id="empDept" required>
        <label for="empSalary">Salary (Rs.)</label>
        <input id="empSalary" type="number" step="0.01" required>
        <button class="btn" type="submit">Add employee</button>
      </form>

      <form class="panel" id="raiseForm">
        <h2>Give salary raise</h2>
        <label for="raiseId">Employee ID</label>
        <input id="raiseId" required>
        <label for="raisePercent">Raise (%)</label>
        <input id="raisePercent" type="number" step="0.01" required>
        <button class="btn" type="submit">Apply raise</button>
      </form>

      <div class="panel">
        <h2>Data file</h2>
        <button class="btn ghost" id="downloadBtn" type="button">Download employees.json</button>
        <button class="btn ghost" id="loadBtn" type="button">Load employees.json</button>
        <input type="file" id="fileInput" accept=".json" hidden>
      </div>

    </aside>

    <!-- RIGHT SIDE: department buttons + ID cards -->
    <main class="main">
      <div class="chips" id="chips"></div>
      <div class="cards" id="cards"></div>
    </main>

  </div>

  <script src="script.js"></script>
</body>
</html>
